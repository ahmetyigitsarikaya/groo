name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-validation:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, json, mbstring, fileinfo, xmlwriter, gd, zip
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.php }}-

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Lint all PHP files (php -l)
        run: |
          set -euo pipefail
          FAILED=0
          while IFS= read -r -d '' file; do
            if ! OUTPUT=$(php -l "$file" 2>&1); then
              echo "$OUTPUT"
              FAILED=1
            fi
          done < <(find app install plugins public templates -type f -name '*.php' -print0)
          exit "$FAILED"

      - name: Verify Core PSR-4 autoloading
        run: |
          php -r '
          require "vendor/autoload.php";
          $classes = [
              App\Core\Application::class,
              App\Core\Config::class,
              App\Core\Hook::class,
              App\Core\Database\Connection::class,
              App\Core\Database\QueryBuilder::class,
              App\Core\Database\DynamicEntityRepository::class,
              App\Core\Database\MigrationManager::class,
              App\Core\Events\EventDispatcher::class,
              App\Core\Exceptions\Handler::class,
              App\Core\Http\ApiResponse::class,
              App\Core\Http\Router::class,
              App\Core\Middleware\HTMLOptimizer::class,
              App\Core\Middleware\PageCache::class,
              App\Core\Plugin\PluginManager::class,
              App\Core\Template\TemplateManager::class,
              App\Core\View\View::class,
          ];
          foreach ($classes as $class) {
              if (!class_exists($class)) {
                  fwrite(STDERR, "Failed to autoload {$class}\n");
                  exit(1);
              }
          }
          echo "All " . count($classes) . " core classes autoloaded successfully.\n";
          '
